name: Android Release CI

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:   # <-- Biar bisa di-trigger manual juga

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release
      run: ./gradlew assembleRelease

    - name: Create Release
      run: |
        cd app/build/outputs/apk/release/
        mv app-release.apk NexAlloy-${{ github.ref_name }}.apk
        gh release create ${{ github.ref_name }} NexAlloy-${{ github.ref_name }}.apk --prerelease
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
